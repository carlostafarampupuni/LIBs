# =========================================================
# Cycle — all batches in one file
# =========================================================
# Each batch under `batches:` is fully self-contained (its own raw
# folder, axis limits, tick spacing). Run a notebook on a specific batch:
# project.import_cycle(batch="Batch1") — the batch you name is remembered
# by every later call (analyze_cycle, plot_cycle, ...) until you switch
# it, so you only ever pass batch= once per run.
#
# default_batch is used when you don't pass batch= at all.
#
# Batch keys are just Batch1, Batch2, ... across every technique file in
# this project (uniform naming) — what each one actually IS lives in the
# comment above it, not in the key itself. Edit those comments freely;
# renumbering here needs no code changes anywhere, just update any
# notebook cells using the old key names and this file's default_batch: above.
#
# Tick control: xtick_step/ytick_step pick an EXACT spacing that always
# lands on both ends of xlim/ylim (no missing/odd ticks). xticks_n picks
# an exact tick COUNT instead. Leave both unset for a clean 5-tick
# default instead of matplotlib's own guess.
#
# Drop a brand new batch's raw files straight into Data/Cycle/<name>/ and
# it shows up here automatically next run, with default axis/plot
# settings (see CycleBatchConfig in config/schema.py) — no need to add a
# batches: entry by hand first. An explicit entry below for the same
# name always wins, so tune any batch here
# whenever you want settings different from default.

default_batch: null   # set to your first batch's name once you add one

auto_discover:
  subfolder: Cycle

batches: {}

