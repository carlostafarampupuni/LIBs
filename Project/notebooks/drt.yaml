# =========================================================
# DRT — rides on whichever EIS batch is already imported (eis.yaml)
# =========================================================
# run_drt(batch="BatchN") / plot_drt(batch="BatchN") reuse whatever's
# already been imported under that EIS batch name — nothing here
# duplicates raw-file config, only plot styling per batch.
#
# Row/x-tick labels are read straight from eis.yaml's sheet_names, so
# they're already short there (auto-truncated further at 6 characters
# if not — see plotting/style.py shorten_label()) — nothing to repeat
# here.
#
# clim (colour range of the heatmaps) is left unset on purpose: each
# heatmap then scales to its own data (G.max() * 0.95). If one stage's
# peak is much larger than the rest and flattens them, add e.g.
# `clim: [0, 400]` to that contour_per_sample entry to clip it.

default_batch: null   # set to your first batch's name once you add one

batches: {}

# TEMPLATE — the structure of one batch (values are only an
# example). To add a batch: copy this
# block below `batches:`, remove the leading `# ` from each line,
# replace `{}` after `batches:` with nothing, and change the values.
